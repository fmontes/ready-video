[project]
name = "ready-video"
version = "0.1.0"
description = "Zero-config talking-head video preparation for shorts, reels, and TikToks."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Freddy Montes", email = "freddymontes@gmail.com" }]
keywords = ["video", "subtitles", "whisperx", "ffmpeg", "shorts", "reels", "tiktok", "silence-removal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "platformdirs>=4.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/fmontes/ready-video"
Repository = "https://github.com/fmontes/ready-video"
Issues = "https://github.com/fmontes/ready-video/issues"

[project.optional-dependencies]
# Verified working combo (macOS arm64, Python 3.11): torch 2.8.0 / torchcodec
# 0.7.0 / whisperx 3.8.6. torch, torchcodec, torchaudio, and torchvision are
# tightly coupled and pinned to patch-level so a torch minor bump can't
# reintroduce the torchcodec/FFmpeg load failure. See CONTRIBUTING.md.
transcription = [
  "whisperx~=3.8",
  "torch~=2.8.0",
  "torchaudio~=2.8.0",
  "torchvision~=0.23.0",
  "torchcodec~=0.7.0",
  "ctranslate2~=4.8",
  "transformers~=4.57",
  "numpy~=2.4",
]
dev = ["pytest>=8.0"]

[project.scripts]
ready-video = "ready_video.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ready_video"]

[tool.hatch.build.targets.sdist]
include = [
  "src/ready_video",
  "tests",
  "README.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
