[project]
name = "ready-video"
version = "0.1.0"
description = "Zero-config talking-head video preparation for shorts, reels, and TikToks."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Ready Video contributors" }]
dependencies = [
  "platformdirs>=4.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
transcription = ["whisperx>=3.3"]
dev = ["pytest>=8.0"]

[project.scripts]
ready-video = "ready_video.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ready_video"]

[tool.hatch.build.targets.sdist]
include = [
  "src/ready_video",
  "tests",
  "README.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
